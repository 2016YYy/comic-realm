name: Secret Scanning

# 敏感信息扫描：push / PR 时自动检查是否泄露凭证。
# 对应技能：gitleaks-secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 必须完整历史，否则扫不到旧提交里的泄露
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VER="8.30.1"
          mkdir -p tools/bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C tools/bin gitleaks
          chmod +x tools/bin/gitleaks
          tools/bin/gitleaks version

      - name: Run secret scan
        shell: bash
        run: |
          bash scripts/secret-scan.sh
