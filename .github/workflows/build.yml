name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # 签名配置由 GitHub Secrets 以环境变量注入，仓库内不再保存密钥与口令。
      # 缺任一变量时构建直接失败，不会产出 debug 签名的「发布包」。
      COMICREALM_STORE_FILE: ${{ secrets.COMICREALM_STORE_FILE }}
      COMICREALM_STORE_PASSWORD: ${{ secrets.COMICREALM_STORE_PASSWORD }}
      COMIC_REALM_KEY_ALIAS: ${{ secrets.COMIC_REALM_KEY_ALIAS }}
      COMIC_REALM_KEY_PASSWORD: ${{ secrets.COMIC_REALM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter pub get
      # 签名四要素必须齐全，否则直接失败（防止误发 debug 签名包）
      - name: Verify signing secrets are present
        shell: bash
        env:
          COMICREALM_STORE_FILE: ${{ env.COMICREALM_STORE_FILE }}
          COMICREALM_STORE_PASSWORD: ${{ env.COMICREALM_STORE_PASSWORD }}
          COMIC_REALM_KEY_ALIAS: ${{ env.COMIC_REALM_KEY_ALIAS }}
          COMIC_REALM_KEY_PASSWORD: ${{ env.COMIC_REALM_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$COMICREALM_STORE_FILE" ]    || missing="$missing COMICREALM_STORE_FILE"
          [ -n "$COMICREALM_STORE_PASSWORD" ] || missing="$missing COMICREALM_STORE_PASSWORD"
          [ -n "$COMIC_REALM_KEY_ALIAS" ]    || missing="$missing COMIC_REALM_KEY_ALIAS"
          [ -n "$COMIC_REALM_KEY_PASSWORD" ] || missing="$missing COMIC_REALM_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 Secret:$missing （Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "签名四要素齐全"
      # keystore 内容本身也是 Secret，写到工作区供 Gradle 的 storeFile 读取
      - name: Decode keystore
        shell: bash
        env:
          COMICREALM_KEYSTORE_BASE64: ${{ secrets.COMICREALM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COMICREALM_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret：COMICREALM_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$COMICREALM_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          ls -l android/app/release-keystore.jks
      - run: flutter build apk --release --split-per-abi
      # 编出来的 APK 必须是 release 签名（v1+ 方案，且明确不是 debug 证书）
      - name: Verify APK signing scheme
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools"
          APKSIGNER=""
          for d in 36.0.0 35.0.0 34.0.0; do
            [ -x "$SDK/$d/apksigner" ] && APKSIGNER="$SDK/$d/apksigner" && break
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner，跳过验证"
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'Signer #1 certificate DN|contributes to [0-9]+ signature'
          done
      - name: Rename APK artifacts
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d'+' -f1)
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "ComicRealm-v${VERSION}-android-${abi}.apk"
            fi
          done
          ls -l ComicRealm-*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/ComicRealm-*.apk

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/windows/x64/runner/Release
          7z a -tzip "../../../../../ComicRealm-v${VERSION}-windows-x64.zip" .
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ComicRealm-*.zip

  build-ios:
    name: Build iOS (no-signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip iOS build
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r "../../../ComicRealm-v${VERSION}-ios-unsigned.ipa" Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ComicRealm-*.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Remove stale release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > release_body.md
          echo '--- release_body.md ---'
          cat release_body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 统一 Release 名称格式：ComicRealm vX.Y.Z（与历史一致，避免出现裸标签名）
          name: ComicRealm ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            artifacts/android-apk/ComicRealm-*.apk
            artifacts/windows-zip/ComicRealm-*.zip
            artifacts/ios-ipa/ComicRealm-*.ipa
