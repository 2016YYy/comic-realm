name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Rename APK artifacts
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d'+' -f1)
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "ComicRealm-v${VERSION}-android-${abi}.apk"
            fi
          done
          ls -l ComicRealm-*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/ComicRealm-*.apk

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/windows/x64/runner/Release
          7z a -tzip "../../../../../ComicRealm-v${VERSION}-windows-x64.zip" .
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ComicRealm-*.zip

  build-ios:
    name: Build iOS (no-signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip iOS build
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r "../../../ComicRealm-v${VERSION}-ios-unsigned.ipa" Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ComicRealm-*.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Remove stale release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > release_body.md
          echo '--- release_body.md ---'
          cat release_body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 统一 Release 名称格式：ComicRealm vX.Y.Z（与历史一致，避免出现裸标签名）
          name: ComicRealm ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            artifacts/android-apk/ComicRealm-*.apk
            artifacts/windows-zip/ComicRealm-*.zip
            artifacts/ios-ipa/ComicRealm-*.ipa
