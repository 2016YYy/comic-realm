name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      resign_tag:
        description: '仅重建并替换该版本 tag 的 APK 资产（签名修复用），留空则按普通流程'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发版前强制扫描：任何泄露都会让后续构建无法开始
  secret-scan:
    name: Secret Scan (pre-release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VER="8.30.1"
          mkdir -p tools/bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C tools/bin gitleaks
          chmod +x tools/bin/gitleaks
          tools/bin/gitleaks version
      - name: Run secret scan
        shell: bash
        run: |
          # 有泄露时脚本 exit 1，本 job 失败，构建不会继续
          bash scripts/secret-scan.sh

  build-android:
    name: Build Android APK
    needs: [secret-scan]
    runs-on: ubuntu-latest
    env:
      # 签名配置由 GitHub Secrets 以环境变量注入，仓库内不再保存密钥与口令。
      # 缺任一变量时构建直接失败，不会产出 debug 签名的「发布包」。
      COMICREALM_STORE_FILE: ${{ secrets.COMICREALM_STORE_FILE }}
      COMICREALM_STORE_PASSWORD: ${{ secrets.COMICREALM_STORE_PASSWORD }}
      COMIC_REALM_KEY_ALIAS: ${{ secrets.COMIC_REALM_KEY_ALIAS }}
      COMIC_REALM_KEY_PASSWORD: ${{ secrets.COMIC_REALM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # resign_tag 非空时检出该历史 tag 的源码，用于重建「同源码 + 正式签名」的包
          ref: ${{ github.event.inputs.resign_tag != '' && github.event.inputs.resign_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      # 历史 tag 的源码用的是 debug 签名，这里先改写为读取 release 签名
      - name: Patch signing config for legacy tag
        if: github.event.inputs.resign_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          # 补丁脚本随 workflow 所在分支一起检出；resign 时用主分支的脚本改写旧 tag 的 Gradle 配置
          git show "origin/main:scripts/patch_legacy_signing.py" > /tmp/patch_legacy_signing.py
          python3 /tmp/patch_legacy_signing.py
          echo "--- 改写后的 release 构建块 ---"
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle.kts
      - run: flutter pub get
      # 签名四要素必须齐全，否则直接失败（防止误发 debug 签名包）
      - name: Verify signing secrets are present
        shell: bash
        env:
          COMICREALM_STORE_FILE: ${{ env.COMICREALM_STORE_FILE }}
          COMICREALM_STORE_PASSWORD: ${{ env.COMICREALM_STORE_PASSWORD }}
          COMIC_REALM_KEY_ALIAS: ${{ env.COMIC_REALM_KEY_ALIAS }}
          COMIC_REALM_KEY_PASSWORD: ${{ env.COMIC_REALM_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$COMICREALM_STORE_FILE" ]    || missing="$missing COMICREALM_STORE_FILE"
          [ -n "$COMICREALM_STORE_PASSWORD" ] || missing="$missing COMICREALM_STORE_PASSWORD"
          [ -n "$COMIC_REALM_KEY_ALIAS" ]    || missing="$missing COMIC_REALM_KEY_ALIAS"
          [ -n "$COMIC_REALM_KEY_PASSWORD" ] || missing="$missing COMIC_REALM_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 Secret:$missing （Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "签名四要素齐全"
      # keystore 内容本身也是 Secret，写到工作区供 Gradle 的 storeFile 读取
      - name: Decode keystore
        shell: bash
        env:
          COMICREALM_KEYSTORE_BASE64: ${{ secrets.COMICREALM_KEYSTORE_BASE64 }}
          COMICREALM_STORE_FILE: ${{ secrets.COMICREALM_STORE_FILE }}
        run: |
          if [ -z "$COMICREALM_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret：COMICREALM_KEYSTORE_BASE64"
            exit 1
          fi
          # 文件名必须与 Gradle 读取的 COMICREALM_STORE_FILE 一致，
          # 否则 validateSigningRelease 会报 "Keystore file ... not found"。
          STORE_FILE="${COMICREALM_STORE_FILE:-release-keystore.jks}"
          printf '%s' "$COMICREALM_KEYSTORE_BASE64" | base64 -d > "android/app/$STORE_FILE"
          ls -l "android/app/$STORE_FILE"
      - run: flutter build apk --release --split-per-abi
      # 编出来的 APK 必须是 release 签名（v1+ 方案，且明确不是 debug 证书）
      - name: Verify APK signing scheme
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools"
          APKSIGNER=""
          for d in 36.0.0 35.0.0 34.0.0; do
            [ -x "$SDK/$d/apksigner" ] && APKSIGNER="$SDK/$d/apksigner" && break
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner，跳过验证"
            exit 1
          fi
          # 期望的第 2 代证书指纹（2026-10-22 换发）。
          # 换证书时必须同步更新这里，否则构建会因指纹不符而失败——
          # 这是刻意设计的：防止「以为换了证书、实际仍用旧证书」。
          EXPECTED_SHA256="FD:FB:16:F1:7F:16:CE:4F:DD:30:03:7B:25:2C:6D:E4:44:18:13:7F:15:6B:A9:77:29:4B:31:33:1A:2E:8C:BC"
          # apksigner 输出的是「小写、无冒号」格式（如 fdfb16f1...），
          # 而文档与配置里习惯写「大写、带冒号」。比较前统一归一化，
          # 否则正确的证书也会被判为不符（v2.0.0 首次构建即因此误判失败）。
          normalize() { echo "$1" | tr -d ':' | tr 'A-F' 'a-f'; }
          EXPECTED_NORM="$(normalize "$EXPECTED_SHA256")"
          FAILED=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs "$apk" | grep -E 'Signer #1 certificate DN|contributes to [0-9]+ signature'
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            ACTUAL_NORM="$(normalize "$ACTUAL")"
            if [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
              echo "::error::$apk 证书指纹不符！期望 $EXPECTED_SHA256，实际 $ACTUAL"
              FAILED=1
            else
              echo "   ✔ 证书指纹与新证书一致（$ACTUAL）"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
      - name: Rename APK artifacts
        run: |
          VERSION=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d'+' -f1)
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "ComicRealm-v${VERSION}-android-${abi}.apk"
            fi
          done
          ls -l ComicRealm-*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/ComicRealm-*.apk
      # 重建历史版本时：用新签名的 APK 替换该 Release 里旧的（debug 签名的）资产
      - name: Replace legacy release assets
        if: github.event.inputs.resign_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.resign_tag }}"
          echo "== 替换 $TAG 的 APK 资产 =="
          # 先删除旧的 apk 资产，再上传新的
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | endswith(".apk")) | .name' \
            | while read -r name; do
                [ -n "$name" ] || continue
                echo "删除旧资产: $name"
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              done
          gh release upload "$TAG" build/app/outputs/flutter-apk/ComicRealm-*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "== 替换完成 =="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size)"'

  build-windows:
    name: Build Windows
    # 签名修复模式只需重编 Android，跳过 Windows
    if: ${{ github.event.inputs.resign_tag == '' || github.event.inputs.resign_tag == null }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/windows/x64/runner/Release
          7z a -tzip "../../../../../ComicRealm-v${VERSION}-windows-x64.zip" .
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ComicRealm-*.zip

  build-ios:
    name: Build iOS (no-signed)
    # 签名修复模式只需重编 Android，跳过 iOS
    if: ${{ github.event.inputs.resign_tag == '' || github.event.inputs.resign_tag == null }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip iOS build
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/.*: *//' | cut -d'+' -f1)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r "../../../ComicRealm-v${VERSION}-ios-unsigned.ipa" Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ComicRealm-*.ipa

  release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-ios]
    # 仅 tag 推送时创建/更新 Release；签名修复模式不碰 Release 正文
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display structure
        run: ls -R artifacts
      - name: Remove stale release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true
      - name: Build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > release_body.md
          echo '--- release_body.md ---'
          cat release_body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # 统一 Release 名称格式：ComicRealm vX.Y.Z（与历史一致，避免出现裸标签名）
          name: ComicRealm ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            artifacts/android-apk/ComicRealm-*.apk
            artifacts/windows-zip/ComicRealm-*.zip
            artifacts/ios-ipa/ComicRealm-*.ipa
