# 严格扫描配置：不放过任何疑似凭证（用于排查历史泄露）
#
# 与 .gitleaks.toml 的区别：**不做口令白名单**，
# 因此 CHANGELOG / SIGNING.md 里对旧口令的记录也会被报出来——这是刻意的，
# 排查时要看到「哪里提到过凭证」，而不是被白名单掩盖。
# 但仍排除构建产物目录，避免 .dart_tool / build 里的编译缓存干扰。

title = "comic-realm strict scan"

[extend]
useDefault = true

[[rules]]
id = "android-signing-password"
description = "Android Gradle 签名口令明文"
regex = '''(?i)(storePassword|keyPassword)\s*=\s*["']([^"']{4,})["']'''
secretGroup = 2
keywords = ["storepassword", "keypassword"]

[[rules]]
id = "generic-hardcoded-password"
description = "通用硬编码口令（password / secret / token 赋值）"
regex = '''(?i)(password|passwd|secret|token|api_key|apikey|access_key)\s*[:=]\s*["']([A-Za-z0-9_\-!@#$%^&*+]{8,})["']'''
secretGroup = 2
entropy = 2.5
keywords = ["password", "passwd", "secret", "token", "api_key", "apikey", "access_key"]

[[rules]]
id = "private-key-block"
description = "私钥文件内容"
regex = '''-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'''
keywords = ["BEGIN", "PRIVATE KEY"]

[allowlist]
description = "仅排除构建产物与工具二进制目录（不含任何口令白名单）"
paths = [
  '''(^|/)\.dart_tool/''',
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)tools/bin/''',
]